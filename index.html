<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Hunter System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column "system window" — status panel, sticky tab rail, panels per tab. Deliberately single dark look. */
:root{
  --void:#070b16;        /* page ground */
  --panel:#0d1630;       /* system window fill */
  --line:#24407a;        /* window border */
  --glow:#4fa3ff;        /* system blue */
  --ice:#d6e8ff;         /* primary text */
  --mist:#8399c2;        /* secondary text */
  --gold:#f2c14e;        /* rank / rewards */
  --red:#ff5d6c;         /* penalty */
  --ok:#4fe0b0;          /* cleared */
  --violet:#b48cff;      /* hidden quests */
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"Barlow",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{background:var(--void)}
body{margin:0;-webkit-tap-highlight-color:transparent;color:var(--ice);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(79,163,255,.16),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.win{background:linear-gradient(180deg,rgba(79,163,255,.06),transparent 40%),var(--panel);border:1px solid var(--line);border-radius:4px;
  box-shadow:0 0 0 1px rgba(79,163,255,.08),0 0 24px rgba(79,163,255,.12) inset;padding:16px;position:relative;min-width:0}
.win::before,.win::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--glow)}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--glow)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:17px;letter-spacing:.06em;text-transform:uppercase}
h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);margin-top:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--mist)}
.small{font-size:13px}
p{margin:0}

/* Status */
.status{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:10px}
.rank{width:78px;height:78px;display:grid;place-items:center;border:2px solid var(--gold);border-radius:4px;
  font-family:var(--display);font-weight:700;font-size:44px;color:var(--gold);text-shadow:0 0 14px rgba(242,193,78,.5);
  box-shadow:0 0 18px rgba(242,193,78,.18) inset;position:relative}
.rank small{position:absolute;bottom:3px;font-size:9px;letter-spacing:.16em;color:var(--mist);text-shadow:none}
.who{min-width:0}
.who h1{font-size:20px;line-height:1.15}
.title{font-family:var(--display);font-size:13px;color:var(--gold);letter-spacing:.06em}
.lvlrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.lvl{font-family:var(--display);font-size:15px}
.lvl b{font-size:22px;color:var(--glow)}
.bar{height:8px;background:rgba(79,163,255,.12);border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2b74d8,var(--glow));box-shadow:0 0 10px var(--glow);transition:width .5s ease}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-family:var(--mono);font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:2px;color:var(--mist)}
.chip b{color:var(--ice)}
.chip.sp{border-color:var(--gold);color:var(--gold)}
.chip.sp b{color:var(--gold)}

.penalty{border-color:var(--red)}
.penalty::before,.penalty::after{border-color:var(--red)}
.penalty .eyebrow{color:var(--red)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  background:var(--void);padding-block:8px}
.tabs button{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--panel);color:var(--mist);
  border:1px solid var(--line);border-radius:2px;padding:10px 2px;cursor:pointer;min-width:0}
.tabs button[aria-selected="true"]{color:var(--void);background:var(--glow);border-color:var(--glow);box-shadow:0 0 14px rgba(79,163,255,.5)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#view{display:flex;flex-direction:column;gap:14px}

/* Quests */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.qlist{display:flex;flex-direction:column;gap:8px}
.quest{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:rgba(7,11,22,.55);border:1px solid var(--line);border-radius:2px;padding:12px;color:inherit;font:inherit;cursor:pointer}
.quest:hover{border-color:var(--glow)}
.box{width:24px;height:24px;border:2px solid var(--glow);border-radius:2px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--void)}
.quest.done .box{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px rgba(79,224,176,.5)}
.quest.done .qt{color:var(--mist);text-decoration:line-through;text-decoration-color:rgba(131,153,194,.6)}
.quest.off{opacity:.45}
.qt{font-weight:600;min-width:0}
.qd{display:block;font-size:13px;color:var(--mist);font-weight:400}
.rew{font-family:var(--mono);font-size:12px;color:var(--gold);text-align:right;white-space:nowrap}
.rew small{display:block;color:var(--mist)}
.quest.side{border-style:dashed}
.quest.hidden{border-color:var(--violet);background:rgba(180,140,255,.06)}
.quest.hidden .box{border-color:var(--violet)}
.quest.hidden.done .box{background:var(--violet);border-color:var(--violet);box-shadow:0 0 10px rgba(180,140,255,.5)}
.quest.job{border-color:var(--gold)}
.tag{display:inline-block;font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;border-radius:2px;margin-right:6px;vertical-align:1px}
.tag.v{color:var(--violet)}
.tag.g{color:var(--gold)}
.foot{margin-top:12px;font-size:13px;color:var(--mist)}
.clear{color:var(--ok);font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:13px}

/* day mode */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
.seg button{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:transparent;color:var(--mist);
  border:1px solid var(--line);border-radius:2px;padding:9px 4px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--void);background:var(--mist);border-color:var(--mist)}
.seg button.call[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}

/* progress meter for weekly target */
.pips{display:flex;gap:4px;margin-bottom:12px}
.pips i{flex:1;height:6px;border:1px solid var(--line);border-radius:1px}
.pips i.on{background:var(--ok);border-color:var(--ok)}
.pips i.tgt{border-color:var(--gold)}

/* heatmap */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:10px}
.heat i{aspect-ratio:1;max-width:100%;border-radius:2px;background:rgba(79,163,255,.06);border:1px solid rgba(36,64,122,.6)}
.heat i.h1{background:rgba(79,224,176,.25);border-color:transparent}
.heat i.h2{background:rgba(79,224,176,.5);border-color:transparent}
.heat i.h3{background:rgba(79,224,176,.8);border-color:transparent}
.heat i.h4{background:var(--ok);border-color:transparent;box-shadow:0 0 6px rgba(79,224,176,.6)}
.heat i.r{background:rgba(131,153,194,.35);border-color:transparent}
.heat i.m{background:rgba(255,93,108,.18);border-color:rgba(255,93,108,.5)}
.heat i.f{opacity:.15}
.heat i.t{outline:1px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--mist)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;border:1px solid var(--line);vertical-align:-1px;border-radius:2px}
.legend .l4::before{background:var(--ok);border-color:var(--ok)}
.legend .l2::before{background:rgba(79,224,176,.5);border-color:transparent}
.legend .lr::before{background:rgba(131,153,194,.35);border-color:transparent}
.legend .lm::before{border-color:rgba(255,93,108,.5);background:rgba(255,93,108,.18)}

/* chart */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-family:var(--mono);font-size:9px;fill:var(--mist)}
.chart .b{fill:rgba(79,163,255,.45)}
.chart .b.cur{fill:var(--glow)}
.chart .b.hit{fill:rgba(79,224,176,.6)}
.chart .tl{stroke:var(--gold);stroke-dasharray:4 3;stroke-width:1}
.chart .gl{stroke:rgba(36,64,122,.7);stroke-width:1}
.chart text.tg{fill:var(--gold)}
.chart text.v{fill:var(--ice);font-weight:700}

/* report + records */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cell{border:1px solid var(--line);border-radius:2px;padding:10px;background:rgba(7,11,22,.5);min-width:0}
.cell .k{font-size:12px;color:var(--mist)}
.cell .v{font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.cell .d{font-family:var(--mono);font-size:11px}
.up{color:var(--ok)}.down{color:var(--red)}

/* stats */
.stats{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.stat{display:grid;grid-template-columns:48px 1fr auto auto;gap:10px;align-items:center}
.stat .k{font-family:var(--display);font-weight:700;font-size:18px;color:var(--glow)}
.stat .n{font-size:13px}
.stat .lv{font-family:var(--mono);font-size:14px;text-align:right;white-space:nowrap}
.stat .lv em{font-style:normal;color:var(--gold)}
.stat .bar{height:6px;margin-top:4px}
.plus{width:30px;height:30px;font-family:var(--mono);font-weight:700;font-size:16px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:2px;cursor:pointer}
.plus:disabled{opacity:.2;cursor:default}

/* ranks */
.ranks{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rk{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:14px}
.rk b{font-family:var(--display);font-size:18px;text-align:center;color:var(--mist);line-height:1.2}
.rk.got b{color:var(--gold)}
.rk:not(.got){color:var(--mist)}
.req{display:block;font-size:12px;font-family:var(--mono)}
.req .y{color:var(--ok)}.req .n{color:var(--mist)}

/* jobs */
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.job{text-align:left;background:rgba(7,11,22,.55);border:1px solid var(--line);border-radius:2px;padding:10px;color:inherit;font:inherit;cursor:pointer;min-width:0}
.job b{display:block;font-family:var(--display);font-size:14px;color:var(--gold)}
.job span{display:block;font-size:12px;color:var(--mist)}
.job[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 12px rgba(242,193,78,.25) inset}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.badge{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:2px;padding:8px;min-width:0}
.badge .ic{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;font-family:var(--display);font-weight:700;color:var(--mist);font-size:13px;transform:rotate(45deg)}
.badge .ic span{transform:rotate(-45deg)}
.badge b{display:block;font-size:13px;font-family:var(--display);letter-spacing:.03em}
.badge small{display:block;font-size:11px;color:var(--mist);line-height:1.3}
.badge.got{border-color:var(--gold)}
.badge.got .ic{border-color:var(--gold);color:var(--void);background:var(--gold);box-shadow:0 0 10px rgba(242,193,78,.4)}
.badge:not(.got) b{color:var(--mist)}

.danger{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:12px;background:transparent;color:var(--mist);
  border:1px solid var(--line);border-radius:2px;padding:8px 12px;cursor:pointer}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.gold{color:var(--gold);border-color:var(--gold)}
textarea{width:100%;min-height:90px;background:var(--void);color:var(--ice);border:1px solid var(--line);border-radius:2px;padding:8px;font-family:var(--mono);font-size:12px;margin-top:6px}

/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  z-index:20;background:var(--panel);border:1px solid var(--gold);color:var(--gold);padding:14px 20px;border-radius:2px;text-align:center;
  font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 0 30px rgba(242,193,78,.35);transition:.3s;width:max-content;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.v{border-color:var(--violet);color:var(--violet);box-shadow:0 0 30px rgba(180,140,255,.35)}
.toast small{display:block;color:var(--ice);letter-spacing:.04em;text-transform:none;font-family:var(--body);margin-top:4px}
@media (max-width:360px){.tabs button{font-size:10px;letter-spacing:.04em}.ach,.jobs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="win" aria-label="Status">
    <div class="eyebrow">Status window</div>
    <div class="status">
      <div class="rank" id="rank">E<small>RANK</small></div>
      <div class="who">
        <h1 id="name">Neurosurgery Hunter</h1>
        <div class="title" id="title">Awakened</div>
        <div class="lvlrow"><span class="lvl">LV <b id="lvl">1</b></span><span class="mono muted" id="xpText">0 / 100 XP</span></div>
        <div class="bar"><i id="xpBar" style="width:0%"></i></div>
      </div>
    </div>
    <div class="chips">
      <span class="chip">Streak <b id="streak">0</b>d</span>
      <span class="chip">This week <b id="wkxp">0</b> XP</span>
      <span class="chip sp" id="spChip" hidden><b id="sp">0</b> skill pts</span>
    </div>
  </section>

  <section class="win penalty" id="penalty" hidden>
    <div class="eyebrow">Penalty quest</div>
    <p style="margin-top:6px">Two days missed in a row. Today, just clear the minimum: debrief any case you do and read the approach for your next one. Clearing today's dailies lifts the penalty.</p>
  </section>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-today" data-tab="today">Daily</button>
    <button role="tab" id="tab-week" data-tab="week">Weekly</button>
    <button role="tab" id="tab-gates" data-tab="gates">Gates</button>
    <button role="tab" id="tab-hunter" data-tab="hunter">Hunter</button>
    <button role="tab" id="tab-log" data-tab="log">Log</button>
  </nav>

  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){

];

  {id:"spine",t:"Spine Hunter",d:"Cervical and lumbar mastery",stat:"STR",q:{t:"Review one spine case with a consultant",d:"Imaging, plan, levels, fixation choice",xp:25}},

  {id:"trauma",t:"Trauma Knight",d:"Decompression under pressure",stat:"WIS",q:{t:"Audit one TBI decision",d:"Would you operate again? What did the CT say?",xp:25}},
  {id:"onc",t:"Tumour Assassin",d:"Resection and the margins",stat:"INT",q:{t:"Plan one tumour approach from MRI",d:"Corridor, eloquent cortex, extent of resection",xp:25}},

];
const DUNGEONS=[
  {id:"trauma",t:"Trauma",d:"Trauma craniotomy, DECRA, burr holes"},
  {id:"cspine",t:"Cervical spine",d:"ACDF, posterior cervical fixation"},
  {id:"tlspine",t:"Thoracolumbar spine",d:"Laminectomy, pedicle screws, discectomy"},
  {id:"vascular",t:"Vascular",d:"Pterional, orbitozygomatic, aneurysm and AVM"},
  {id:"supra",t:"Supratentorial tumours",d:"Convexity, parasagittal, interhemispheric"},
  {id:"pfossa",t:"Posterior fossa and skull base",d:"Retrosigmoid, suboccipital, CSF leak"},
  {id:"paeds",t:"Paediatrics and CSF",d:"VP shunt, ETV, myelomeningocele"},
  {id:"func",t:"Functional, nerve, infection",d:"Empyema, abscess, carpal tunnel"},
];

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=k=>new Date(k+"T00:00:00");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekKey=d=>{const x=new Date(d);const wd=(x.getDay()+6)%7;return ymd(addDays(x,-wd))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(k,o)=>parse(k).toLocaleDateString("en-ZA",o);
function hiddenFor(k){let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;return HIDDEN[h%HIDDEN.length]}

/* ---------- levelling: paced to about five years of registrar training ---------- */
function levelInfo(xp){let L=1,acc=0,need=100;while(xp>=acc+need){acc+=need;L++;need=100+25*(L-1)}return {lvl:L,into:xp-acc,need}}
function statLevel(xp){let L=1,acc=0,need=60;while(xp>=acc+need){acc+=need;L++;need=60+15*(L-1)}return {lvl:L,into:xp-acc,need}}

/* ---------- state ---------- */
const LS="hunter-system-v1";
function blank(){return {start:ymd(new Date()),daily:{},weekly:{},dungeons:{},bosses:{},alloc:{},job:null,name:""}}
function norm(s){const b=blank();if(!s||typeof s!=="object")return b;
  return {start:s.start||b.start,daily:s.daily||{},weekly:s.weekly||{},dungeons:s.dungeons||{},bosses:s.bosses||{},
    alloc:s.alloc||{},job:s.job||null,name:typeof s.name==="string"?s.name:""}}
let state=blank();
try{const raw=localStorage.getItem(LS);if(raw)state=norm(JSON.parse(raw))}catch(e){}

/* day rules: normal = 2 of 3 core; on call = debrief; rest = protected */
function coreCount(day){return day?CORE.filter(q=>day[q.id]).length:0}
function dayCleared(day){if(!day||day.rest)return false;return day.call?!!day.debrief:coreCount(day)>=2}
function dayOk(day){return dayCleared(day)||!!(day&&day.rest)}
function weekCount(w){return w?WEEKLY.filter(q=>w[q.id]).length+(w.job?1:0):0}
function weekTotal(){return WEEKLY.length+(state.job?1:0)}

function compute(s){
  const st={STR:0,INT:0,WIS:0,END:0,VIT:0};
  const wk={};const addW=(k,x)=>{wk[k]=(wk[k]||0)+x};
  let total=0;const add=(stat,x,k)=>{st[stat]+=x;total+=x;if(k)addW(weekKey(parse(k)),x)};
  let quests=0,daysCleared=0,perfectDays=0,callClears=0,hidden=0;
  for(const k in s.daily){const day=s.daily[k];
    for(const q of CORE.concat(SIDE)) if(day[q.id]){add(q.stat,q.xp,k);quests++}
    if(day.hidden){const h=hiddenFor(k);add(h.stat,h.xp,k);quests++;hidden++}
    if(dayCleared(day)){total+=DAILY_BONUS;addW(weekKey(parse(k)),DAILY_BONUS);daysCleared++;if(day.call)callClears++}
    if(!day.rest&&!day.call&&coreCount(day)===3){total+=PERFECT_DAY;addW(weekKey(parse(k)),PERFECT_DAY);perfectDays++}}
  let weeksCleared=0,perfectWeeks=0;
  const job=JOBS.find(j=>j.id===s.job);
  for(const k in s.weekly){const w=s.weekly[k];
    for(const q of WEEKLY) if(w[q.id]){add(q.stat,q.xp,k);quests++}
    if(w.job&&job){add(job.stat,job.q.xp,k);quests++}
    const n=WEEKLY.filter(q=>w[q.id]).length+(w.job?1:0);
    if(n>=WEEK_TARGET){total+=WEEK_BONUS;addW(k,WEEK_BONUS);weeksCleared++}
    if(WEEKLY.every(q=>w[q.id])){total+=PERFECT_WEEK;addW(k,PERFECT_WEEK);perfectWeeks++}}
  let gates=0;for(const d of DUNGEONS) if(s.dungeons[d.id]){add("INT",DUNGEON_XP,s.dungeons[d.id]);gates++;quests++}
  let bossCount=0;for(const b of BOSSES) if(s.bosses[b.id]){add(b.stat,b.xp,s.bosses[b.id]);bossCount++}
  const L=levelInfo(total);
  const spent=Object.values(s.alloc).reduce((a,b)=>a+(+b||0),0);
  const sp=SP_PER_LEVEL*(L.lvl-1)-spent;
  const statLv={};const statInfo={};
  for(const k in STATS){const i=statLevel(st[k]);statInfo[k]=i;statLv[k]=i.lvl+(+s.alloc[k]||0)}
  let rank=RANKS[0];for(const r of RANKS) if(L.lvl>=r.lvl&&r.need.every(id=>s.bosses[id])) rank=r;
  let title=TITLES[0][1];for(const [lv,t] of TITLES) if(L.lvl>=lv) title=t;
  // streaks
  const today=ymd(new Date());let run=0,best=0;
  for(let d=parse(s.start<today?s.start:today);ymd(d)<=today;d=addDays(d,1)){const k=ymd(d);
    if(dayOk(s.daily[k])){run++;best=Math.max(best,run)}else if(k!==today)run=0}
  let cur=0;{let d=new Date();if(!dayOk(s.daily[ymd(d)]))d=addDays(d,-1);while(dayOk(s.daily[ymd(d)])){cur++;d=addDays(d,-1)}}
  // weekly runs
  let wrun=0,bestWeekRun=0;const thisWk=weekKey(new Date());
  for(let d=parse(weekKey(parse(s.start))),guard=0;ymd(d)<=thisWk&&guard<600;d=addDays(d,7),guard++){const k=ymd(d);
    if(weekCount(s.weekly[k])>=WEEK_TARGET){wrun++;bestWeekRun=Math.max(bestWeekRun,wrun)}else if(k!==thisWk)wrun=0}
  const bestWeek=Math.max(0,...Object.values(wk));
  const c={st,statInfo,statLv,total,L,sp,spent,rank,title,wk,quests,daysCleared,perfectDays,callClears,hidden,weeksCleared,perfectWeeks,
    gates,bossCount,bestStreak:Math.max(best,cur),streak:cur,bestWeekRun,bestWeek,job:s.job};
  c.ach=ACH.filter(a=>a.test(c)).map(a=>a.id);
  return c;
}
function penalty(s){
  const t=new Date();if(dayOk(s.daily[ymd(t)]))return false;
  const k1=ymd(addDays(t,-1)),k2=ymd(addDays(t,-2));
  if(k2<s.start)return false;
  return !dayOk(s.daily[k1])&&!dayOk(s.daily[k2]);
}

function questBtn(act,id,q,done,cls,tag){
  return `<button class="quest${done?" done":""}${cls||""}" data-act="${act}" data-id="${id}" aria-pressed="${done}">
    <span class="box" aria-hidden="true">${done?"✓":""}</span>
    <span class="qt">${tag||""}${esc(q.t)}<span class="qd">${esc(q.d||"")}</span></span>
    <span class="rew">+${q.xp} XP<small>${q.stat||""}</small></span></button>`;
}

function weekChart(c){
  const now=new Date();const keys=[];for(let i=11;i>=0;i--)keys.push(weekKey(addDays(now,-7*i)));
  const vals=keys.map(k=>c.wk[k]||0);
  const max=Math.max(WEEK_XP_GOAL*1.25,...vals);
  const W=340,H=150,top=16,bot=22,left=4,right=4,ih=H-top-bot,bw=(W-left-right)/12;
  const y=v=>top+ih-ih*v/max;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="XP per week, last 12 weeks">`;
  s+=`<line class="gl" x1="${left}" x2="${W-right}" y1="${top+ih}" y2="${top+ih}"/>`;
  s+=`<line class="tl" x1="${left}" x2="${W-right}" y1="${y(WEEK_XP_GOAL)}" y2="${y(WEEK_XP_GOAL)}"/>`;
  s+=`<text class="tg" x="${W-right}" y="${y(WEEK_XP_GOAL)-4}" text-anchor="end">goal ${WEEK_XP_GOAL}</text>`;
  keys.forEach((k,i)=>{const v=vals[i],x=left+i*bw+3,h=Math.max(v?2:0,ih*v/max);const cur=i===11;
    s+=`<rect class="b${cur?" cur":v>=WEEK_XP_GOAL?" hit":""}" x="${x.toFixed(1)}" y="${(top+ih-h).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${h.toFixed(1)}" rx="1"><title>${fmt(k,{day:"numeric",month:"short"})}: ${v} XP</title></rect>`;
    if(cur&&v) s+=`<text class="v" x="${(x+(bw-6)/2).toFixed(1)}" y="${(top+ih-h-4).toFixed(1)}" text-anchor="middle">${v}</text>`;
    if(i%3===0||cur) s+=`<text x="${(x+(bw-6)/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${cur?"now":fmt(k,{day:"numeric",month:"short"})}</text>`;
  });
  return s+"</svg>";
}

function heatmap(){
  const now=new Date();const tk=ymd(now);const startMon=parse(weekKey(addDays(now,-7*15)));
  let h="";
  for(let i=0;i<16*7;i++){const d=addDays(startMon,i),k=ymd(d),day=state.daily[k];
    let cls="";
    if(k>tk)cls="f";
    else if(day&&day.rest)cls="r";
    else if(day){const n=coreCount(day)+(day.move?1:0)+(day.hidden?1:0);
      if(dayCleared(day))cls=n>=4?"h4":n>=3?"h3":"h2";else if(n>0)cls="h1";else if(k<tk&&k>=state.start)cls="m"}
    else if(k<tk&&k>=state.start)cls="m";
    if(k===tk)cls+=" t";
    h+=`<i class="${cls}" title="${k}"></i>`}
  return `<div class="heat" aria-label="Last 16 weeks of daily activity">${h}</div>`;
}

      ${n>=WEEK_TARGET?`<p class="foot"><span class="clear">Week cleared</span> · +${WEEK_BONUS} XP${WEEKLY.every(q=>w[q.id])?` · Perfect week +${PERFECT_WEEK}`:""}</p>`:`<p class="foot">${WEEK_TARGET-n} more to clear the week for +${WEEK_BONUS} XP.</p>`}
    </section>`;

    <section class="win"><div class="eyebrow">System</div>
      <div style="margin-top:8px"><label for="nameBox" class="small muted">Hunter name</label>
        <div class="danger" style="margin-top:4px"><input id="nameBox" maxlength="32" value="${esc(state.name)}" placeholder="Neurosurgery Hunter" style="flex:1;min-width:0;background:var(--void);color:var(--ice);border:1px solid var(--line);border-radius:2px;padding:8px;font:inherit"><button class="btn" data-act="saveName">Save</button></div></div>
      <p class="small muted" style="margin-top:12px">Progress lives on this phone. Copy a backup code every week or two and keep it in Notes.</p>
      <div class="danger"><button class="btn" data-act="backup">Copy backup code</button><button class="btn" data-act="restoreOpen">Restore from code</button></div>
      ${restoreOpen?`<div style="margin-top:10px"><label for="restoreBox" class="small muted">Paste your backup code</label><textarea id="restoreBox"></textarea><div class="danger"><button class="btn" data-act="restoreDo">Restore</button><button class="btn" data-act="restoreNo">Cancel</button></div></div>`:""}
      ${backupShow?`<div style="margin-top:10px"><label for="backupBox" class="small muted">Your backup code (select and copy)</label><textarea id="backupBox" readonly>${esc(JSON.stringify(state))}</textarea></div>`:""}
      <div class="danger">${resetArm?`<span class="small muted">Erase all progress?</span><button class="btn red" data-act="resetYes">Erase</button><button class="btn" data-act="resetNo">Keep</button>`:`<button class="btn" data-act="resetArm">Reset progress</button>`}</div>
    </section>`;
  }else{
    const lastWk=weekKey(addDays(now,-7));
    const tw=state.weekly[wk]||{},lw=state.weekly[lastWk]||{};
    const daysIn=(k,n)=>{let x=0;for(let i=0;i<n;i++)if(dayCleared(state.daily[ymd(addDays(parse(k),i))]))x++;return x};
    const elapsed=((now.getDay()+6)%7)+1;
    const d=(a,b)=>{const x=a-b;return x===0?`<span class="d muted">same as last week</span>`:`<span class="d ${x>0?"up":"down"}">${x>0?"▲":"▼"} ${Math.abs(x)} vs last week</span>`};
    const twx=c.wk[wk]||0,lwx=c.wk[lastWk]||0;
    const daysSince=Math.round((parse(tk)-parse(state.start))/864e5)+1;
    const avg=Math.round(c.total/Math.max(1,daysSince/7));
    const toNext=c.L.need-c.L.into;
    v.innerHTML=`<section class="win"><div class="eyebrow">Weekly report</div>
      <h2 style="margin-top:4px">Week of ${fmt(wk,{day:"numeric",month:"short"})}</h2>
      <div class="grid2">
        <div class="cell"><div class="k">XP this week</div><div class="v">${twx}</div>${d(twx,lwx)}</div>
        <div class="cell"><div class="k">Days cleared</div><div class="v">${daysIn(wk,elapsed)}<span class="muted" style="font-size:13px"> / ${elapsed}</span></div>${d(daysIn(wk,elapsed),daysIn(lastWk,elapsed))}</div>
        <div class="cell"><div class="k">Weekly quests</div><div class="v">${weekCount(tw)}<span class="muted" style="font-size:13px"> / ${WEEK_TARGET}</span></div>${d(weekCount(tw),weekCount(lw))}</div>
        <div class="cell"><div class="k">Next level</div><div class="v">${toNext}</div><span class="d muted">XP to level ${c.L.lvl+1}</span></div>
      </div>
    </section>
    <section class="win"><div class="eyebrow">XP per week</div>
      <p class="small muted" style="margin-top:4px">Last 12 weeks. Green bars hit the ${WEEK_XP_GOAL} XP goal, a realistic pace with call.</p>
      ${weekChart(c)}
    </section>
    <section class="win"><div class="eyebrow">Last 16 weeks</div>
      ${heatmap()}
      <div class="legend"><span class="l4">Strong day</span><span class="l2">Cleared</span><span class="lr">Rest</span><span class="lm">Missed</span></div>
    </section>
    <section class="win"><div class="eyebrow">Personal records</div>
      <div class="grid2">
        <div class="cell"><div class="k">Longest streak</div><div class="v">${c.bestStreak}<span class="muted" style="font-size:13px"> days</span></div></div>
        <div class="cell"><div class="k">Best week</div><div class="v">${c.bestWeek}<span class="muted" style="font-size:13px"> XP</span></div></div>
        <div class="cell"><div class="k">Quests done</div><div class="v">${c.quests}</div></div>
        <div class="cell"><div class="k">Days cleared</div><div class="v">${c.daysCleared}</div></div>
        <div class="cell"><div class="k">Total XP</div><div class="v">${c.total.toLocaleString("en-ZA")}</div></div>
        <div class="cell"><div class="k">Average per week</div><div class="v">${avg}</div></div>
      </div>
      <p class="foot">Hunting since ${fmt(state.start,{day:"numeric",month:"long",year:"numeric"})} · day ${daysSince}</p>
    </section>`;
  }
}

/* ---------- toasts ---------- */
const queue=[];let showing=false;
function toast(title,sub,cls){queue.push([title,sub,cls]);if(!showing)next()}
function next(){const t=document.getElementById("toast");const m=queue.shift();if(!m){showing=false;return}showing=true;
  t.className="toast"+(m[2]?" "+m[2]:"");t.innerHTML=esc(m[0])+(m[1]?`<small>${esc(m[1])}</small>`:"");
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show");setTimeout(next,350)},2300)}

/* ---------- actions ---------- */
function toggle(obj,key){if(obj[key])delete obj[key];else obj[key]=true}
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;resetArm=false;jobPick=false;render();window.scrollTo({top:0});return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==="resetArm"){resetArm=true;render();return}
  if(act==="resetNo"){resetArm=false;render();return}
  if(act==="jobPick"){jobPick=true;render();return}
  if(act==="saveName"){state.name=document.getElementById("nameBox").value.trim().slice(0,32);save();render();toast("Name saved","");return}
  if(act==="backup"){const txt=JSON.stringify(state);
    const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject();
    p.then(()=>toast("Backup copied","Paste it into Notes")).catch(()=>{backupShow=true;render();const bx=document.getElementById("backupBox");if(bx){bx.focus();bx.select()}});return}
  if(act==="restoreOpen"){restoreOpen=true;backupShow=false;render();return}
  if(act==="restoreNo"){restoreOpen=false;render();return}
  if(act==="restoreDo"){const bx=document.getElementById("restoreBox");
    try{const obj=JSON.parse(bx.value.trim());if(!obj||typeof obj!=="object"||!obj.daily)throw 0;state=norm(obj);restoreOpen=false;save();render();toast("Progress restored","")}
    catch(err){toast("That code didn't work","Copy the whole backup code and try again")}return}

  const before=compute(state);
  const now=new Date(),tk=ymd(now),wk=weekKey(now);
  const wasCleared=dayCleared(state.daily[tk]);
  if(act==="resetYes"){state=blank();resetArm=false}
  else if(act==="daily"){const d=state.daily[tk]=Object.assign({},state.daily[tk]);toggle(d,id)}
  else if(act==="mode"){const d=state.daily[tk]=Object.assign({},state.daily[tk]);delete d.rest;delete d.call;if(id==="rest")d.rest=true;if(id==="call")d.call=true}
  else if(act==="weekly"){const w=state.weekly[wk]=Object.assign({},state.weekly[wk]);toggle(w,id)}
  else if(act==="dungeon"){if(state.dungeons[id])delete state.dungeons[id];else state.dungeons[id]=tk}
  else if(act==="boss"){if(state.bosses[id])delete state.bosses[id];else state.bosses[id]=tk}
  else if(act==="alloc"){if(before.sp>0)state.alloc[id]=(+state.alloc[id]||0)+1}
  else if(act==="realloc"){state.alloc={}}
  else if(act==="job"){state.job=id;jobPick=false}
  const after=compute(state);
  // keep skill points valid if levels drop after unticking
  if(after.sp<0){let over=-after.sp;for(const k of Object.keys(state.alloc).reverse()){const t=Math.min(over,+state.alloc[k]||0);state.alloc[k]-=t;over-=t;if(!state.alloc[k])delete state.alloc[k]}}
  const fin=compute(state);
  if(RANKS.indexOf(fin.rank)>RANKS.indexOf(before.rank)) toast("Rank up: "+fin.rank.r,fin.rank.t);
  if(fin.L.lvl>before.L.lvl){toast("Level up",`Level ${fin.L.lvl} · +${SP_PER_LEVEL*(fin.L.lvl-before.L.lvl)} skill points`);
    if(fin.title!==before.title) toast("New title",fin.title);
    if(before.L.lvl<JOB_LEVEL&&fin.L.lvl>=JOB_LEVEL) toast("Job change unlocked","Choose your class on the Hunter tab")}
  for(const a of fin.ach) if(!before.ach.includes(a)){const A=ACH.find(x=>x.id===a);toast("Achievement",A.t)}
  if(act==="daily"&&id==="hidden"&&state.daily[tk].hidden) toast("Hidden quest complete","+15 XP","v");
  else if((act==="daily"||act==="mode")&&!wasCleared&&dayCleared(state.daily[tk])) toast("Daily quest cleared",`+${DAILY_BONUS} XP bonus`);
  if(act==="dungeon"&&state.dungeons[id]) toast("Gate cleared",`+${DUNGEON_XP} INT`);
  if(act==="boss"&&state.bosses[id]) toast("Boss defeated","Reward claimed");
  render();save();
});

/* ---------- persistence: this phone only ---------- */
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){toast("Couldn't save","Storage is full or blocked")}}
render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
</body>
</html>
